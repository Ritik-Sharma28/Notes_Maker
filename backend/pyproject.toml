[project]
name = "chatnotes"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",

    # LLM — LangChain + LangGraph
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",

    # Embeddings (local, no API)
    "sentence-transformers>=3.0",

    # Ingestion
    "playwright>=1.45",

    # Export
    "markdown-it-py>=3.0",
    "pygments>=2.18",
    "weasyprint>=62",
    "jinja2>=3.1",

    # Background tasks
    "arq>=0.26",

    # Config & utilities
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.11",
]
