<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — ChatNotes</title>
    <meta name="description" content="Study notes for {{ title }}, generated by ChatNotes AI">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Mermaid for diagrams -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

        function initMermaid() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            mermaid.initialize({
                startOnLoad: false,
                theme: 'base',
                themeVariables: isDark ? {
                    primaryColor: '#818cf8',
                    primaryTextColor: '#1e1b4b',
                    primaryBorderColor: '#6366f1',
                    lineColor: '#a5b4fc',
                    secondaryColor: '#e0e7ff',
                    tertiaryColor: '#f5f3ff',
                    fontFamily: 'Inter, sans-serif',
                    fontSize: '14px'
                } : {
                    primaryColor: '#c7d2fe',
                    primaryTextColor: '#312e81',
                    primaryBorderColor: '#6366f1',
                    lineColor: '#6366f1',
                    secondaryColor: '#e0e7ff',
                    tertiaryColor: '#eef2ff',
                    fontFamily: 'Inter, sans-serif',
                    fontSize: '14px'
                }
            });
            mermaid.run();
        }

        // Initial render
        initMermaid();

        // Re-render on theme toggle
        window.reinitMermaid = initMermaid;
    </script>

    <style>
        {{ pygments_css }}
    </style>
    <style>
        {{ main_css }}
    </style>
</head>
<body>
    <div class="note-wrapper">
        <!-- Theme Toggle -->
        <button class="theme-toggle" id="themeToggle" title="Toggle light/dark mode" aria-label="Toggle theme">
            <span class="toggle-icon" id="toggleIcon">🌙</span>
        </button>

        <!-- Header -->
        <header class="note-header">
            <div class="header-badge">📝 ChatNotes</div>
            <h1>{{ title }}</h1>
            <div class="header-meta">
                <span class="meta-item">🤖 AI-generated study notes</span>
                <span class="meta-divider">·</span>
                <span class="meta-item">📅 {{ generated_at }}</span>
            </div>
        </header>

        <!-- Content -->
        <main class="note-content">
            {{ content | safe }}
        </main>

        <!-- Footer -->
        <footer class="note-footer">
            <p>Generated by <strong>ChatNotes</strong> — Multi-agent AI notes from your chat conversations</p>
        </footer>
    </div>

    <script>
        // Theme toggle logic
        const toggle = document.getElementById('themeToggle');
        const icon = document.getElementById('toggleIcon');
        const html = document.documentElement;

        // Load saved preference
        const saved = localStorage.getItem('chatnotes-theme');
        if (saved) {
            html.setAttribute('data-theme', saved);
            icon.textContent = saved === 'dark' ? '🌙' : '☀️';
        }

        toggle.addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            icon.textContent = next === 'dark' ? '🌙' : '☀️';
            localStorage.setItem('chatnotes-theme', next);

            // Re-render mermaid with new theme colors
            if (window.reinitMermaid) {
                // Reset mermaid elements so they re-render
                document.querySelectorAll('.mermaid').forEach(el => {
                    const code = el.getAttribute('data-original') || el.textContent;
                    el.setAttribute('data-original', code);
                    el.removeAttribute('data-processed');
                    el.innerHTML = code;
                });
                window.reinitMermaid();
            }
        });
    </script>
</body>
</html>
